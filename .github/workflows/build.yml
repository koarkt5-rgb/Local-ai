name: Build APK from ZIP

on:
  push:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp tag"
        default: "b5000"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "В репозитории нет .zip файла"; exit 1; fi
          echo "Распаковываю $ZIP"
          mkdir -p _unz
          unzip -q -o "$ZIP" -d _unz
          S=$(find _unz -name settings.gradle | head -n1)
          if [ -z "$S" ]; then echo "В zip нет settings.gradle"; exit 1; fi
          cp -r "$(dirname "$S")" project
          ls -la project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone llama.cpp
        working-directory: project
        run: |
          TAG="${{ github.event.inputs.llama_tag }}"
          if [ -z "$TAG" ]; then TAG="b5000"; fi
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
          rm -rf app/src/main/cpp/llama.cpp/.git

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk LocalAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAI-apk
          path: LocalAI.apk

      - name: Publish release (direct APK link)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocalAI build ${{ github.run_number }}
          files: LocalAI.apk
